version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
  # Optional: low value while dependencies = [] (only test/research extras).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2
